<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учет посещаемости</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 16px/1.5 system-ui, sans-serif;
            color: #172d42;
            background: #f3f6fa;
        }

        header {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px 5%;
            color: white;
            background: #173b58;
        }

        header a {
            color: white;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-left: auto;
        }

        nav form {
            margin: 0;
        }

        main {
            max-width: 1120px;
            margin: 32px auto;
            padding: 0 24px;
        }

        h1 {
            font-size: 30px;
        }

        h2 {
            font-size: 22px;
        }

        a {
            color: #126593;
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #cdd7e1;
            text-align: left;
        }

        th {
            background: #e9eff5;
        }

        .panel {
            margin: 20px 0;
            padding: 24px;
            border: 1px solid #dce3eb;
            border-radius: 10px;
            background: white;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card {
            flex: 1;
            padding: 20px;
            border: 1px solid #dce3eb;
            border-radius: 10px;
            background: white;
        }

        .big {
            font-size: 30px;
            font-weight: 700;
        }

        button,
        .button {
            padding: 10px 18px;
            border: 0;
            border-radius: 5px;
            background: #126593;
            color: white;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        input,
        select {
            padding: 9px;
            border: 1px solid #a9bac8;
            border-radius: 4px;
            font: inherit;
        }

        label {
            display: block;
        }

        small {
            color: #607284;
        }

        .errorlist,
        .error {
            color: #a02222;
        }

        code {
            font-size: 14px;
        }

        pre {
            padding: 16px;
            background: #edf2f7;
            white-space: pre-wrap;
        }

        .chart {
            display: flex;
            height: 24px;
            overflow: hidden;
            border-radius: 6px;
            background: #eee;
        }

        .present {
            background: #258665;
        }

        .absent {
            background: #d26251;
        }

        .excused {
            background: #dfb445;
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 16px;
            }

            nav {
                width: 100%;
                margin-left: 0;
                flex-wrap: wrap;
                gap: 10px 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <strong>УЧЕТ ПОСЕЩАЕМОСТИ</strong>

        <nav>
            {% if user.is_authenticated %}
                <a href="/">Журнал</a>
                <a href="/api/docs/">API</a>
                <span>{{ user.username }} · {{ user.get_role_display }}</span>

                <form method="post" action="/logout/">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="/login/">Вход</a>
                <a href="/register/">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
